spring.application.name=PH_Personal

# Configuracao do banco H2 (em memoria)
spring.datasource.url=jdbc:h2:mem:personal_trainer_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 (para visualizar o banco pelo navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracao do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

server.port=8080